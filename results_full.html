<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نتائج البحث - Alislamiah</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a1628;
            color: #e8f0fe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== الشريط العلوي الثابت (لا يختفي أبداً) ========== */
        #top-bar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 99999 !important;
            background: rgba(8, 20, 42, 0.98) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(60, 120, 200, 0.25);
            padding: 10px 14px;
            display: flex !important;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 10, 30, 0.5);
            visibility: visible !important;
            opacity: 1 !important;
            height: auto;
            min-height: 56px;
            overflow: visible !important;
        }

        .back-btn, .home-btn, .more-btn {
            background: none;
            border: none;
            color: #8bb8e8;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        .back-btn:active, .home-btn:active, .more-btn:active {
            background: rgba(40, 90, 160, 0.3);
            color: #fff;
        }

        .more-wrap {
            position: relative;
            flex: 0 0 auto;
            z-index: 100001;
        }

        .more-menu {
            display: none;
            position: fixed;
            background: rgba(12, 28, 52, 0.98);
            border: 1px solid rgba(80, 150, 230, 0.4);
            border-radius: 14px;
            min-width: 180px;
            box-shadow: 0 12px 40px rgba(0, 10, 40, 0.7);
            z-index: 1000000;
            overflow: visible;
            padding: 6px 0;
        }

        .more-menu.show {
            display: block;
        }

        .more-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: none;
            border: none;
            color: #d0e6ff;
            font-size: 14px;
            padding: 12px 16px;
            cursor: pointer;
            text-align: right;
            direction: rtl;
            transition: background 0.15s;
        }

        .more-menu button:hover,
        .more-menu button:active {
            background: rgba(40, 90, 160, 0.35);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 40, 80, 0.95);
            color: #e8f4ff;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 2000;
            opacity: 0;
            transition: transform 0.25s, opacity 0.25s;
            pointer-events: none;
            border: 1px solid rgba(80, 150, 230, 0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .logo {
            font-weight: 700;
            font-size: 15px;
            color: #5eb0ff;
            white-space: nowrap;
            display: none;
        }

        @media (min-width: 500px) {
            .logo { display: block; }
        }

        .search-form {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            background: rgba(15, 35, 65, 0.9);
            border: 1px solid rgba(80, 150, 230, 0.3);
            border-radius: 28px;
            padding: 8px 12px;
            gap: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 100%;
        }

        .more-btn {
            font-size: 22px !important;
            font-weight: bold;
            line-height: 1;
            min-width: 36px;
            min-height: 36px;
        }

        .search-form:focus-within {
            border-color: rgba(100, 180, 255, 0.6);
            box-shadow: 0 0 0 2px rgba(80, 150, 230, 0.2);
        }

        .search-form input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e8f4ff;
            font-size: 15px;
            direction: rtl;
            min-width: 0;
        }

        .search-form input::placeholder {
            color: #6a8fb8;
        }

        .search-btn {
            background: none;
            border: none;
            color: #5eb0ff;
            font-size: 18px;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
        }

        /* ========== المحتوى ========== */
        #main-content {
            margin-top: 68px;
            padding: 12px 14px 30px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            transition: opacity 0.2s;
        }

        #main-content.hidden {
            display: none !important;
        }

                        /* صندوق الرد الذكي — مساحة البطاقة كاملة بألوان النجمة */
        .ai-box {
            background: linear-gradient(135deg,
                #4285F4 0%,
                #34A853 32%,
                #FBBC05 66%,
                #EA4335 100%);
            border: none;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 18px;
            display: none;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }

        .ai-box.show {
            display: block;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }

        .ai-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .ai-content {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.75;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .ai-content.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ai-show-more {
            display: none;
            margin-top: 8px;
            background: rgba(255,255,255,0.25);
            border: none;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
        }
        .ai-show-more.visible {
            display: inline-block;
        }

.result-card {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: rgba(12, 28, 52, 0.7);
            border: 1px solid rgba(50, 100, 180, 0.18);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .result-card:hover, .result-card:active {
            background: rgba(18, 40, 75, 0.9);
            border-color: rgba(80, 150, 230, 0.4);
        }

        .favicon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            object-fit: contain;
            flex-shrink: 0;
            padding: 4px;
        }

        .result-body {
            flex: 1;
            min-width: 0;
        }

        .result-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .result-type {
            font-size: 11px;
            background: rgba(30, 80, 160, 0.4);
            color: #6ec0ff;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .result-url {
            font-size: 12px;
            color: #6a8fb8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
            color: #8ec8ff;
            margin-bottom: 4px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-desc {
            font-size: 13px;
            color: #9bb4d0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* فيديو */
        .video-card {
            display: flex;
            gap: 12px;
        }

        .video-thumb {
            position: relative;
            width: 140px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-duration {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.55);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* لا نتائج */
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #6a8fb8;
        }

        .no-results .icon {
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ========== إطار الموقع (تحت الشريط دائماً) ========== */
        #site-frame-wrap {
            display: none;
            position: fixed;
            top: 60px; /* يُحدَّث ديناميكياً */
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            background: #0a1628;
        }

        #site-frame-wrap.active {
            display: block;
        }

        #site-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .frame-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a1628;
            color: #6a8fb8;
            font-size: 15px;
            z-index: 1;
        }
    </style>
</head>

    <header id="top-bar">
        <button class="back-btn" onclick="goBack()" title="رجوع">←</button>
        <button class="home-btn" onclick="goHome()" title="الرئيسية">🏠</button>
        <span class="logo">Alislamiah</span>
        <form class="search-form" onsubmit="doSearch(event)">
            <input type="text" id="searchInput" placeholder="ابحث في الإسلامية..." autocomplete="off">
            <button type="submit" class="search-btn">🔍</button>
        </form>
        <div class="more-wrap">
            <button class="more-btn" onclick="toggleMoreMenu(event)" title="المزيد">⋮</button>
            <div class="more-menu" id="moreMenu">
                <button onclick="copyCurrentLink()">🔗 Copy Link</button>
                <button onclick="shareCurrent()">📤 Share</button>
            </div>
        </div>
    </header>
    <div class="toast" id="toast"></div>

    <!-- قائمة النتائج -->
    <main id="main-content">
        <div id="aiBox" class="ai-box">
            <div class="ai-header">
                <span>✦</span> رد الذكاء الاصطناعي

            <div id="aiText" class="ai-content"></div>
            <button type="button" class="ai-show-more" id="aiShowMoreBtn">Show more</button>
        </div>
        <div id="resultsList"></div>
    </main>

    <!-- إطار الموقع (يبقى الشريط العلوي ظاهراً) -->
    <div id="site-frame-wrap">

        <iframe id="site-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>

        // ===================== الوظائف =====================
        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch (e) {
                return 'https://www.google.com/favicon.ico';
            }
        }

        function getAIResponse(query) {
            const q = String(query || "").toLowerCase().trim();
            if (!q) return "";

            // مطابقة من العنوان (title) فقط — ليس الرابط
            const aiMatches = library.filter(function(item) {
                const tt = String(item.title || "").toLowerCase();
                if (tt.includes(q)) return true;
                return q.split(/\s+/).filter(function(w) { return w.length > 1; }).some(function(w) {
                    return tt.includes(w);
                });
            });

            if (aiMatches.length > 0) {
                return aiMatches.map(function(item) {
                    const title = item.title || "موقع";
                    const desc = String(item.desc || "").trim();
                    const type = item.type || "موقع";
                    if (desc) {
                        return "<p style=\"margin-bottom:12px\">" + type + " <strong>" + title + "</strong> — " + desc + "</p>";
                    }
                    return "<p style=\"margin-bottom:12px\">" + type + " <strong>" + title + "</strong> — ضمن فهرس Alislamiah ويمكنك فتحه من النتائج أدناه.</p>";
                }).join("");
            }

            return "بناءً على بحثك عن \"<strong>" + String(query).replace(/</g, "&lt;") + "</strong>\"، لم نجد وصفاً مطابقاً في الفهرس حالياً.";
        }

        function applyAiShowMore() {
            const box = document.getElementById("aiText");
            const btn = document.getElementById("aiShowMoreBtn");
            if (!box || !btn) return;
            box.classList.remove("clamped");
            btn.classList.remove("visible");
            btn.textContent = "Show more";
            btn.onclick = null;
            requestAnimationFrame(function() {
                const lineH = parseFloat(getComputedStyle(box).lineHeight) || 24;
                const maxH = lineH * 3 + 2;
                if (box.scrollHeight > maxH) {
                    box.classList.add("clamped");
                    btn.classList.add("visible");
                    var expanded = false;
                    btn.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        expanded = !expanded;
                        if (expanded) {
                            box.classList.remove("clamped");
                            btn.textContent = "Show less";
                        } else {
                            box.classList.add("clamped");
                            btn.textContent = "Show more";
                        }
                    };
                }
            });
        }


        function renderResults(query) {
            const resultsList = document.getElementById('resultsList');
            const aiBox = document.getElementById('aiBox');
            const aiText = document.getElementById('aiText');

            if (!query) {
                aiBox.classList.remove('show');
                resultsList.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <p>اكتب كلمة للبحث في قاعدة بيانات الإسلامية</p>
                    </div>`;
                return;
            }

            aiBox.classList.add('show');
            aiText.innerHTML = getAIResponse(query);
            applyAiShowMore();

            const q = query.toLowerCase().trim();
            const filtered = library.filter(item =>
                (item.title || '').toLowerCase().includes(q) ||
                (item.desc || '').toLowerCase().includes(q) ||
                (item.url || '').toLowerCase().includes(q)
            );

            if (filtered.length === 0) {
                resultsList.innerHTML = `
                    <div class="no-results">
                        <div class="icon">📭</div>
                        <p>عذراً، لم نتمكن من العثور على نتائج مطابقة لـ "<strong>${query}</strong>"</p>
                    </div>`;
                return;
            }

            resultsList.innerHTML = filtered.map(item => {
                const safeUrl = (item.url || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
                if (item.type === 'video' && item.thumbnail) {
                    return `
                    <div class="result-card video-card" data-url="${safeUrl}" role="button">
                        <div class="video-thumb">
                            <img src="${item.thumbnail}" alt="" loading="lazy">
                            <span class="video-duration">${item.duration || ''}</span>
                            <div class="video-play">▶</div>
                        </div>
                        <div class="result-body">
                            <div class="result-meta">
                                <span class="result-type">فيديو</span>
                            </div>
                            <div class="result-title">${item.title}</div>
                            <div class="result-desc">${item.desc}</div>
                        </div>
                    </div>`;
                }
                return `
                <div class="result-card" data-url="${safeUrl}" role="button">
                    <img class="favicon" src="${getFavicon(item.url)}" alt="" onerror="this.src='https://www.google.com/favicon.ico'" loading="lazy">
                    <div class="result-body">
                        <div class="result-meta">
                            <span class="result-type">${item.type || 'موقع'}</span>
                            <span class="result-url">${(item.url || '').replace(/^https?:\/\//, '')}</span>
                        </div>
                        <div class="result-title">${item.title}</div>
                        <div class="result-desc">${item.desc}</div>
                    </div>
                </div>`;
            }).join('');
        }

        let currentOpenUrl = ''; // الرابط الحالي (للنسخ والمشاركة)

        // مواقع تمنع iframe الكامل (ما عدا فيديوهات يوتيوب المضمّنة)
        const blockedInFrame = [
            'instagram.com', 'www.instagram.com',
            'facebook.com', 'www.facebook.com', 'fb.com',
            'twitter.com', 'x.com', 'www.twitter.com', 'www.x.com',
            'tiktok.com', 'www.tiktok.com',
            'linkedin.com', 'www.linkedin.com'
        ];

        function isBlockedInFrame(url) {
            try {
                const host = new URL(url).hostname.replace(/^www\./, '');
                return blockedInFrame.some(d => host === d.replace(/^www\./, '') || host.endsWith('.' + d.replace(/^www\./, '')));
            } catch (e) {
                return false;
            }
        }

        // تحويل روابط يوتيوب إلى رابط تضمين (يبقى الشريط ظاهراً)
        function toYouTubeEmbed(url) {
            try {
                const u = new URL(url);
                let id = null;
                if (u.hostname.includes('youtu.be')) {
                    id = u.pathname.slice(1).split('/')[0];
                } else if (u.hostname.includes('youtube.com')) {
                    if (u.pathname.startsWith('/watch')) id = u.searchParams.get('v');
                    else if (u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2];
                    else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
                    else if (u.pathname.startsWith('/live/')) id = u.pathname.split('/')[2];
                    // قنوات يوتيوب لا يمكن تضمينها → null
                }
                if (id) return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            } catch (e) {}
            return null;
        }

        function isYouTube(url) {
            try {
                const h = new URL(url).hostname;
                return h.includes('youtube.com') || h.includes('youtu.be');
            } catch (e) { return false; }
        }

        function doSearch(e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            closeFrame();
            currentOpenUrl = '';
            const url = new URL(window.location);
            url.searchParams.set('q', q);
            history.replaceState(null, '', url);
            renderResults(q);
        }

        function openSite(url) {
            currentOpenUrl = url;
            closeMoreMenu();

            const topBar = document.getElementById('top-bar');
            if (topBar) {
                topBar.style.cssText += ';display:flex!important;visibility:visible!important;opacity:1!important;z-index:99999!important;';
            }

            // إنستاغرام وغيرها ممنوعة → تبويب جديد (الشريط يبقى في صفحة النتائج)
            if (isBlockedInFrame(url)) {
                window.open(url, '_blank', 'noopener,noreferrer');
                showToast('تم فتح الرابط في تبويب جديد — الشريط يبقى هنا');
                return;
            }

            // يوتيوب: حاول التضمين (فيديو) حتى يبقى الشريط
            let loadUrl = url;
            if (isYouTube(url)) {
                const embed = toYouTubeEmbed(url);
                if (embed) {
                    loadUrl = embed; // فيديو → يبقى داخل الصفحة مع الشريط
                } else {
                    // قناة يوتيوب لا تُضمَّن → تبويب جديد
                    window.open(url, '_blank', 'noopener,noreferrer');
                    showToast('تم فتح القناة في تبويب جديد — الشريط يبقى هنا');
                    return;
                }
            }

            const wrap = document.getElementById('site-frame-wrap');
            const frame = document.getElementById('site-frame');
            const loading = document.getElementById('frameLoading');
            const main = document.getElementById('main-content');

            const barHeight = topBar ? topBar.offsetHeight : 60;
            wrap.style.top = barHeight + 'px';

            main.classList.add('hidden');
            wrap.classList.add('active');
            loading.style.display = 'flex';
            loading.innerHTML = 'جاري التحميل...';
            frame.src = loadUrl;

            frame.onload = () => {
                loading.style.display = 'none';
            };

            setTimeout(() => {
                if (loading.style.display !== 'none') {
                    loading.innerHTML = 'جاري الفتح في تبويب جديد...';
                    setTimeout(() => {
                        window.open(url, '_blank', 'noopener,noreferrer');
                        closeFrame();
                        showToast('تم فتح الرابط في تبويب جديد — الشريط يبقى هنا');
                    }, 600);
                }
            }, 3500);
        }

        function closeFrame() {
            const wrap = document.getElementById('site-frame-wrap');
            const frame = document.getElementById('site-frame');
            const main = document.getElementById('main-content');
            wrap.classList.remove('active');
            frame.src = 'about:blank';
            main.classList.remove('hidden');
            document.getElementById('frameLoading').style.display = 'flex';
            document.getElementById('frameLoading').innerHTML = 'جاري التحميل...';
        }

        function goBack() {
            closeMoreMenu();
            const wrap = document.getElementById('site-frame-wrap');
            if (wrap.classList.contains('active')) {
                closeFrame();
                currentOpenUrl = '';
            } else {
                if (history.length > 1) history.back();
                else goHome();
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // ===== قائمة الثلاث نقاط =====
        function toggleMoreMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('moreMenu');
            const btn = e.currentTarget || document.querySelector('.more-btn');
            const isOpen = menu.classList.contains('show');

            if (isOpen) {
                menu.classList.remove('show');
                return;
            }

            // حساب موضع الزر ووضع القائمة تحته مباشرة (ثابتة على الشاشة)
            const rect = btn.getBoundingClientRect();
            menu.style.top = (rect.bottom + 8) + 'px';
            // محاذاة من اليمين حتى لا تخرج من الشاشة
            const menuWidth = 180;
            let left = rect.right - menuWidth;
            if (left < 8) left = 8;
            if (left + menuWidth > window.innerWidth - 8) {
                left = window.innerWidth - menuWidth - 8;
            }
            menu.style.left = left + 'px';
            menu.style.right = 'auto';
            menu.classList.add('show');
        }

        function closeMoreMenu() {
            const menu = document.getElementById('moreMenu');
            if (menu) menu.classList.remove('show');
        }

        function getLinkToCopy() {
            // إذا كان موقع مفتوح حالياً → انسخه، وإلا انسخ رابط صفحة النتائج
            if (currentOpenUrl) return currentOpenUrl;
            return window.location.href;
        }

        function copyCurrentLink() {
            closeMoreMenu();
            const link = getLinkToCopy();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link).then(() => {
                    showToast('تم نسخ الرابط ✓');
                }).catch(() => {
                    fallbackCopy(link);
                });
            } else {
                fallbackCopy(link);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('تم نسخ الرابط ✓');
            } catch (e) {
                showToast('تعذر النسخ');
            }
            document.body.removeChild(ta);
        }

        function shareCurrent() {
            closeMoreMenu();
            const link = getLinkToCopy();
            const title = document.title || 'Alislamiah';
            if (navigator.share) {
                navigator.share({
                    title: title,
                    url: link
                }).catch(() => {
                    // المستخدم ألغى أو فشل → نسخ كبديل
                    copyCurrentLink();
                });
            } else {
                // المتصفح لا يدعم Share API → نسخ الرابط
                copyCurrentLink();
                showToast('تم نسخ الرابط للمشاركة');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        // إغلاق القائمة عند النقر خارجها
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.more-wrap') && !e.target.closest('.more-menu')) {
                closeMoreMenu();
            }
        });

        // فتح الروابط عبر data-url (يعمل مع كل الروابط حتى التي فيها علامات خاصة)
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.result-card[data-url]');
            if (card) {
                e.preventDefault();
                const url = card.getAttribute('data-url');
                if (url) openSite(url);
            }
        });

        // عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q') || '';
            document.getElementById('searchInput').value = q;
            renderResults(q);
        });
    </script>
</body>
</html>
